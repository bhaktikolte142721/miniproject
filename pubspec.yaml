name: sentinel_ward
description: "SENTINEL-Ward: Multi-Patient Acute Care Vitals Telemetry & Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Real-time Telemetry & WebSockets
  socket_io_client: ^2.0.3+1
  
  # Clinical Trends & Waveform Charts
  fl_chart: ^0.68.0
  
  # Typography & Iconography
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  
  # Utilities & Formatting
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
